{% extends 'users/email/base.html' %}
{% load static %}

{% block content %}
    <h1
        style="
        margin: 0;
        background: #16a34a;
        padding: 32px 0;
        text-align: center;
        font-size: 22px;
        color: white;
        font-weight: bold;
        text-shadow: 2px 1px 2px rgba(0, 0, 0, 0.3);
        "
    >
        VERIFICAÇÃO DE EMAIL
    </h1>

    <div style="padding: 0 24px 8px">
        <p
            style="
                margin: 20px 0;
                font-size: 18px;
                text-align: center;
                text-wrap: pretty;
            "
        >
            Olá {{ user.first_name }}, segue abaixo o 
            <span style="font-weight: bold">código de validação</span>
            de email:
        </p>
        
        <div
            style="
                display: table;
                background: rgba(0, 0, 0, 0.15);
                padding: 3px 4px;
                margin: 0 auto;
                font-size: 22px;
                border: 1px solid rgba(0, 0, 0, 0.05);
            "
        >
            {{ code|slice:":3" }}-{{ code|slice:"3:" }}   
        </div>
        
        <p
            style="
                display: block;
                margin: 20px auto 0 auto;
                font-size: 13px;
                text-align: center;
            "
            >
            Ignore esse email caso tenha recebido por engano
        </p>
    </div>
{% endblock content %}
